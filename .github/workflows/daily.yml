name: Daily Topic Scout

on:
  schedule:
    - cron: '0 8 * * *'  # Daily at 8am UTC
  workflow_dispatch:       # Allow manual trigger

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Fetch topics
        run: python fetch_topics.py
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Score and pick topics
        run: python score_and_pick.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Generate dashboard
        run: python generate_dashboard.py

      - name: Commit and push
        run: |
          git config user.name "Topic Scout Bot"
          git config user.email "bot@hexalogic.dev"
          git add output/
          git diff --staged --quiet || git commit -m "Daily topic scout update $(date -u +%Y-%m-%d)"
          git push
